<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05090c">
<meta name="robots" content="noindex">
<title>XSupport · Members Dashboard</title>
<style>
  /* TOKENS: same as the XSupport homepage, so the dashboard feels like one product */
  :root{--bg:#05090c;--ink:#f3f7f6;--mut:rgba(243,247,246,.66);--line:rgba(255,255,255,.14);--glass:rgba(255,255,255,.06);
    --acc:#c0cbd7;--acc2:#e1e5eb;--grad:linear-gradient(120deg,#9ca9b9,#e1e5eb);--up:#86b9aa;--dn:#ff8f7e;--warn:#e9c46a;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Roboto,Arial,sans-serif;--ease:cubic-bezier(.22,1,.36,1)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden;
    background-image:radial-gradient(60% 30% at 85% 0%,rgba(160,174,192,.14),transparent 70%),radial-gradient(50% 30% at 0% 35%,rgba(80,140,255,.08),transparent 70%);background-attachment:fixed}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.03em;line-height:1.12}
  p{margin:0}a{color:inherit}
  [hidden]{display:none!important}
  svg{display:block}

  /* LAYOUT: sidebar on desktop, drawer on phones */
  .app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
  .side{position:sticky;top:0;height:100vh;padding:20px 14px calc(env(safe-area-inset-bottom) + 16px);border-right:1px solid var(--line);background:rgba(8,13,17,.88);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);overflow:auto;display:flex;flex-direction:column;gap:2px;z-index:50}
  .logo{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-size:22px;font-weight:700;letter-spacing:-.04em;text-decoration:none}
  .logo img{width:34px;height:34px;object-fit:contain}
  .nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;color:var(--mut);text-decoration:none;font-weight:600;font-size:15px;transition:background .2s,color .2s}
  .nav a svg{width:20px;height:20px;flex:none}
  .nav a:hover{color:var(--ink)}
  .nav a.on{background:var(--glass);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
  .nav b{margin-left:auto;font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.1)}
  .side .out{margin-top:auto}
  .who{padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--glass);font-size:13px;color:var(--mut);margin-bottom:10px;word-break:break-all}
  .who b{display:block;color:var(--ink);font-size:15px;margin-bottom:2px}
  .main{min-width:0}
  .top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:rgba(5,9,12,.72);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid var(--line)}
  .burger{display:none}
  .srch{flex:1;position:relative}
  .srch input{height:44px;padding-left:40px}
  .srch svg{position:absolute;left:13px;top:12px;width:20px;height:20px;color:var(--mut)}
  .tzs{width:auto;height:44px;padding:0 12px;max-width:150px}
  .veil{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .3s}
  @media(max-width:900px){
    .app{display:block}
    .side{position:fixed;inset:0 auto 0 0;width:84%;max-width:310px;transform:translateX(-105%);transition:transform .45s var(--ease)}
    .nav-open .side{transform:none}.nav-open .veil{opacity:1;pointer-events:auto}
    .burger{display:grid}.tzs{display:none}
  }
  #view{padding:22px 16px calc(env(safe-area-inset-bottom) + 60px);max-width:1120px;margin:0 auto}
  .pg h1{font-size:clamp(28px,6vw,38px);margin-bottom:6px}
  .pg>.lead{color:var(--mut);font-size:16px;line-height:1.5;margin-bottom:22px;max-width:680px}

  /* COMPONENTS */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-weight:600;font-size:15px;text-decoration:none;transition:transform .3s var(--ease),background .2s}
  .btn:active{transform:scale(.96)}.btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.pri{background:var(--grad);color:#10151d;border-color:transparent;box-shadow:0 10px 30px rgba(160,174,192,.22)}
  .btn.sm{height:36px;padding:0 14px;font-size:13px}.btn.w{width:100%}.btn.dng{color:var(--dn)}
  input,select,textarea{width:100%;height:46px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:16px;outline:none;transition:border-color .2s}
  select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#9aa 50%),linear-gradient(135deg,#9aa 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
  select option{background:#0c1519;color:#f3f7f6}
  textarea{height:96px;padding:12px 14px;resize:vertical}
  input:focus,select:focus,textarea:focus{border-color:var(--acc)}
  input[type=checkbox]{width:20px;height:20px;accent-color:#c0cbd7;flex:none}
  label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut);font-weight:600}
  .panel{padding:18px;border-radius:24px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.025));-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
  .panel h3{font-size:18px;margin-bottom:12px}.panel h3 small{font-size:12px;font-weight:500;color:var(--mut);margin-left:6px;letter-spacing:0}
  .g{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(min(46%,150px),1fr))}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .mut{color:var(--mut)}.sm{font-size:13px}.up{color:var(--up)}.dn{color:var(--dn)}
  .tag{display:inline-block;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.09);font-size:12px;font-weight:600;color:var(--mut)}
  .tag.hi{background:rgba(255,143,126,.16);color:var(--dn)}.tag.md{background:rgba(233,196,106,.16);color:var(--warn)}.tag.ok{background:rgba(134,185,170,.16);color:var(--up)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;margin-bottom:6px}.chips::-webkit-scrollbar{display:none}
  .chips button{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-size:14px;font-weight:600;color:var(--mut)}
  .chips button.on{background:var(--grad);color:#10151d;border-color:transparent}
  .note{padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:14px;line-height:1.55;color:var(--mut)}
  .note.warn{border-color:rgba(233,196,106,.4);background:rgba(233,196,106,.08)}.note.bad{border-color:rgba(255,143,126,.4);background:rgba(255,143,126,.08)}.note.good{border-color:rgba(134,185,170,.4);background:rgba(134,185,170,.08)}
  .note b{color:var(--ink)}
  .empty{padding:32px 18px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:22px;line-height:1.6}
  .empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
  .spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);animation:sp .8s linear infinite;margin:18px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .kpi b{display:block;font-size:24px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:4px 0}
  .kpi span{font-size:12px;color:var(--mut)}
  .bar{height:8px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}.bar i{display:block;height:100%;background:var(--grad);border-radius:6px;transition:width .6s var(--ease)}
  .sw{position:relative;width:48px;height:28px;flex:none}.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;z-index:1;cursor:pointer}
  .sw i{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.14);transition:.25s}.sw i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.25s var(--ease)}
  .sw input:checked+i{background:#9ca9b9}.sw input:checked+i::after{transform:translateX(20px)}
  .li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}
  .tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
  table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:11px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--mut);font-weight:600;white-space:nowrap}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  details{border-bottom:1px solid var(--line);padding:14px 0}summary{display:flex;justify-content:space-between;gap:12px;list-style:none;font-weight:600;font-size:16px;cursor:pointer}summary::-webkit-details-marker{display:none}summary::after{content:"+";font-size:22px;line-height:1}details[open]>summary::after{content:"–"}details p,details ul{margin:10px 0 0;color:var(--mut);line-height:1.6;font-size:15px}
  .art{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
  .art h4{font-size:17px;line-height:1.3}.art p{font-size:14px;color:var(--mut);line-height:1.5}.art .m{font-size:12px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .bk{background:none;border:0;padding:6px;border-radius:10px;color:var(--mut)}.bk.on{color:var(--acc2)}.bk svg{width:20px;height:20px}
  .res{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.res label{margin:0}
  .out-v{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .modal{position:fixed;inset:0;z-index:70;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.6)}
  .modal.show{display:flex}.modal>div{width:100%;max-width:680px;max-height:92vh;overflow:auto;padding:22px 20px calc(env(safe-area-inset-bottom) + 26px);border-radius:28px 28px 0 0;background:#0b1317;border:1px solid var(--line);animation:up .45s var(--ease)}
  @keyframes up{from{transform:translateY(40px);opacity:0}}
  .modal h2{font-size:26px;margin:8px 0 12px}.modal p{line-height:1.7;margin:0 0 14px;color:#dfe6e5;font-size:16px}.modal ul{color:#dfe6e5;line-height:1.7;padding-left:20px}
  @media(min-width:700px){.modal{align-items:center}.modal>div{border-radius:28px}}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);z-index:90;transform:translate(-50%,30px);opacity:0;padding:12px 18px;border-radius:999px;background:rgba(14,22,27,.96);border:1px solid var(--line);font-size:14px;transition:.4s var(--ease);pointer-events:none;max-width:92%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
  .fade{animation:fd .5s var(--ease)}@keyframes fd{from{opacity:0;transform:translateY(10px)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* SIGN-IN GATE */
  #gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
  #gate .panel{width:100%;max-width:420px;padding:26px 22px}
  #gate .logo{justify-content:center;padding-bottom:10px}
  #gate form{display:flex;flex-direction:column;gap:12px;margin-top:16px}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><g id="p"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g></defs>
  <symbol id="i-overview" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-3H4zM14 8h6V4h-6z"/></symbol>
  <symbol id="i-markets" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M3 17l6-6 4 4 8-9M15 6h6v6"/></symbol>
  <symbol id="i-news" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2zM9 8h6M9 12h6M9 16h4"/></symbol>
  <symbol id="i-calendar" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/></symbol>
  <symbol id="i-prop" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/></symbol>
  <symbol id="i-edu" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M2 9l10-5 10 5-10 5zM6 11.5V16c3 2.5 9 2.5 12 0v-4.5"/></symbol>
  <symbol id="i-tools" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M5 3h14v18H5zM8 7h8M8 12h2M12 12h2M8 16h2M12 16h2M16 12v4"/></symbol>
  <symbol id="i-journal" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 3h12v18H6zM9 8h6M9 12h6M3 7h3M3 11h3M3 15h3"/></symbol>
  <symbol id="i-saved" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 3h12v18l-6-4-6 4z"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c0-4 3.6-6 8-6s8 2 8 6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M4 8h16M4 16h16"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"/></symbol>
</svg>

<!-- SIGN-IN GATE: shown when there is no session -->
<div id="gate" hidden>
  <div class="panel">
    <a class="logo" href="https://xsupport.space/home/"><img src="https://i.postimg.cc/vBByq3Zf/file-00000000fc88821081f5d352763d8347.png" alt="XSupport logo">Support</a>
    <h2 style="text-align:center;font-size:26px">Members dashboard</h2>
    <p class="mut" style="text-align:center;margin-top:6px" id="gateMsg">Sign in to continue.</p>
    <form id="gateForm" novalidate>
      <input name="email" type="email" autocomplete="email" placeholder="Email address" aria-label="Email address">
      <input name="password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password">
      <p class="dn sm" id="gateErr" role="alert"></p>
      <button class="btn pri w" type="submit">Sign in</button>
    </form>
    <p class="mut sm" style="text-align:center;margin-top:16px">No account yet? <a href="https://xsupport.space/home/" style="color:var(--ink);font-weight:600">Create one on the homepage</a></p>
  </div>
</div>

<!-- APP -->
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <a class="logo" href="#/overview"><img src="https://i.postimg.cc/vBByq3Zf/file-00000000fc88821081f5d352763d8347.png" alt="XSupport logo">Support</a>
    <nav class="nav" id="nav"></nav>
    <div class="out">
      <div class="who" id="who"></div>
      <button class="btn w" data-act="signout"><svg width="18" height="18"><use href="#i-out"/></svg>Sign out</button>
    </div>
  </aside>
  <div class="veil" id="veil"></div>
  <div class="main">
    <header class="top">
      <button class="btn sm burger" data-act="menu" aria-label="Open menu" style="width:44px;height:44px;padding:0"><svg width="22" height="22"><use href="#i-menu"/></svg></button>
      <div class="srch"><svg><use href="#i-search"/></svg><input id="q" type="search" placeholder="Search lessons, glossary, saved and news" aria-label="Search"></div>
      <select class="tzs" id="tz" aria-label="Timezone"></select>
    </header>
    <div id="banner" style="padding:12px 16px 0;max-width:1120px;margin:0 auto"></div>
    <main id="view" tabindex="-1"></main>
  </div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div id="modalBody"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/* ============================================================
   XSUPPORT MEMBERS DASHBOARD
   1) helpers  2) session + API  3) per-user data  4) live markets  5) router
   Secrets never live here. Private data must be protected by your Worker (see DASHBOARD-NOTES.md).
   ============================================================ */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CFG = { api: "https://xsupport-api.contact-pawsofjoy.workers.dev", home: "https://xsupport.space/home/" };
const ST = { user: null, verified: null, tz: localStorage.getItem("xs:tz") || "Africa/Lagos", prefs: {}, saved: [], journal: [], progress: {}, firms: [], notifs: [] }, SYNC = {}, ACT = {}, VIEWS = {}, CLEAN = [];
const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 3800); };
const num = v => { const n = parseFloat(String(v).replace(/,/g, "")); return Number.isFinite(n) ? n : NaN; };
const money = (n, d = 2) => Number.isFinite(n) ? n.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }) : "—";

/* ---------- 1) TIME (Africa/Lagos is the default timezone) ---------- */
const TZS = [["Africa/Lagos", "Lagos (WAT)"], ["UTC", "UTC"], ["Europe/London", "London"], ["America/New_York", "New York"], ["Asia/Dubai", "Dubai"], ["Asia/Singapore", "Singapore"], ["Asia/Tokyo", "Tokyo"], ["Australia/Sydney", "Sydney"], ["auto", "This device"]];
const tzOpt = () => ST.tz === "auto" ? {} : { timeZone: ST.tz };
const fmt = (d, o) => new Intl.DateTimeFormat("en-GB", { ...tzOpt(), ...o }).format(d);
const when = d => fmt(d, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const ago = t => { const s = (Date.now() - t) / 1000; return s < 90 ? "just now" : s < 3600 ? Math.round(s / 60) + " min ago" : s < 86400 ? Math.round(s / 3600) + " h ago" : Math.round(s / 86400) + " d ago"; };

/* ---------- 2) SESSION + API ---------- */
const tok = () => sessionStorage.getItem("xsupport_session");           // set by the homepage sign-in (and by the gate below)
const readUser = () => { try { return JSON.parse(sessionStorage.getItem("xsupport_user") || "null"); } catch { return null; } };
async function api(path, o = {}) {
  const h = { "Content-Type": "application/json" }; if (tok()) h.Authorization = "Bearer " + tok();
  try {
    const r = await fetch(CFG.api + path, { method: o.method || "GET", headers: h, body: o.body ? JSON.stringify(o.body) : undefined, credentials: "omit" });
    let d = null; try { d = await r.json(); } catch {}
    return { ok: r.ok && d?.ok !== false, status: r.status, data: d };
  } catch { return { ok: false, status: 0, data: null }; }
}
function clearSession(msg) { sessionStorage.removeItem("xsupport_session"); sessionStorage.removeItem("xsupport_user"); showGate(msg); }
function showGate(msg) { $("#app").hidden = true; $("#gate").hidden = false; if (msg) $("#gateMsg").textContent = msg; }
$("#gateForm").addEventListener("submit", async e => {
  e.preventDefault(); const f = new FormData(e.target), email = String(f.get("email") || "").trim(), password = String(f.get("password") || ""), err = $("#gateErr");
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return err.textContent = "Enter a valid email address.";
  if (password.length < 8) return err.textContent = "Password must be at least 8 characters.";
  err.textContent = ""; const b = e.target.querySelector("button"); b.disabled = true; b.textContent = "Signing in…";
  const r = await api("/api/signin", { method: "POST", body: { email, password } });
  b.disabled = false; b.textContent = "Sign in";

/* ---------- NEWS + CALENDAR LOADERS (real sources only) ---------- */
const NEWS = { items: null, status: {}, t: 0, loading: null };
function parseFeed(xml, f) {
  const doc = new DOMParser().parseFromString(xml, "text/xml"); if (doc.querySelector("parsererror")) throw Error("bad feed");
  return [...doc.querySelectorAll("item,entry")].slice(0, 25).map(it => {
    const g = t => { const e = it.getElementsByTagName(t)[0]; return e ? e.textContent.trim() : ""; };
    let link = g("link"); if (!link) { const le = it.getElementsByTagName("link")[0]; link = le ? (le.getAttribute("href") || "") : ""; }
    return { id: link, url: link, title: strip(g("title")), sum: strip(g("description") || g("summary") || g("content")).slice(0, 240), src: f.n, cat: f.c, ts: Date.parse(g("pubDate") || g("published") || g("updated") || "") || 0 };
  }).filter(a => a.title && /^https?:\/\//.test(a.url) && (!f.only || f.only.test(a.title + " " + a.sum)));
}
function loadNews(force) {
  if (NEWS.loading) return NEWS.loading; if (!force && NEWS.items && Date.now() - NEWS.t < 600000) return Promise.resolve();
  NEWS.loading = (async () => {
    const res = await Promise.allSettled(FEEDS.map(async f => parseFeed(await get(f.u, true), f))); let all = []; NEWS.status = {};
    res.forEach((r, i) => { if (r.status === "fulfilled") { all = all.concat(r.value); NEWS.status[FEEDS[i].n] = r.value.length; } else NEWS.status[FEEDS[i].n] = -1; });
    const seen = new Set(); NEWS.items = all.filter(a => !seen.has(a.url) && seen.add(a.url)).sort((a, b) => b.ts - a.ts); NEWS.t = Date.now(); NEWS.loading = null; window.dispatchEvent(new Event("news"));
  })(); return NEWS.loading;
}
const CAL = { items: null, err: null, t: 0, loading: null };
function loadCal(force) {
  if (CAL.loading) return CAL.loading;
  if (!force && CAL.items && Date.now() - CAL.t < 1800000) return Promise.resolve();
  CAL.loading = (async () => {
    try {
      let j, c; try { c = JSON.parse(localStorage.getItem("xs:cal") || "null"); } catch {}
      if (!force && c && Date.now() - c.t < 1800000) j = c.j; else { j = await get("https://nfs.faireconomy.media/ff_calendar_thisweek.json"); try { localStorage.setItem("xs:cal", JSON.stringify({ t: Date.now(), j })); } catch {} }
      if (!Array.isArray(j)) throw Error("unexpected format");
      CAL.items = j.map(e => ({ ts: Date.parse(e.date), cur: e.country, title: e.title, impact: e.impact, fc: e.forecast, pv: e.previous, ac: e.actual })).filter(e => e.ts && e.title).sort((a, b) => a.ts - b.ts); CAL.err = null; CAL.t = Date.now();
    } catch (e) { CAL.err = e.message || "failed"; }
    CAL.loading = null; window.dispatchEvent(new Event("cal"));
  })(); return CAL.loading;
}
const listen = (ev, fn) => { window.addEventListener(ev, fn); CLEAN.push(() => window.removeEventListener(ev, fn)); };
const artCard = a => `<article class="art"><div class="m"><span class="tag">${esc(a.cat)}</span><span>${esc(a.src)}</span><span>· ${a.ts ? when(new Date(a.ts)) + " (" + ago(a.ts) + ")" : "time not provided"}</span></div>
  <h4><a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a></h4>${a.sum ? `<p>${esc(a.sum)}</p>` : ""}
  <div class="row" style="justify-content:space-between"><a class="btn sm" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">Read at ${esc(a.src)} ↗</a>${bkBtn(a.url, isSaved(a.url))}</div></article>`;

const jform = t => { t = t || { ts: Date.now(), dir: "Long" }; const dl = new Date(t.ts - new Date(t.ts).getTimezoneOffset() * 6e4).toISOString().slice(0, 16), v = x => Number.isFinite(x) ? x : "";
  openModal(`<div class="row" style="justify-content:space-between"><h2 style="margin:0">${t.id ? "Edit trade" : "Add trade"}</h2><button class="btn sm" data-act="close">Close</button></div><form id="jf" class="g g2" style="margin-top:14px" novalidate><label class="f">Date and time<input name="ts" type="datetime-local" value="${dl}" required></label><label class="f">Instrument<input name="ins" list="insl" value="${esc(t.ins || "")}" placeholder="e.g. EURUSD" required></label><datalist id="insl">${Object.keys(SPECS).filter(k => k !== "CUSTOM").map(k => `<option>${k}</option>`).join("")}</datalist>
    <label class="f">Direction<select name="dir"><option ${t.dir === "Long" ? "selected" : ""}>Long</option><option ${t.dir === "Short" ? "selected" : ""}>Short</option></select></label><label class="f">Lots / size (optional)<input name="lots" inputmode="decimal" value="${v(t.lots)}"></label>
    <label class="f">Entry price<input name="entry" inputmode="decimal" value="${v(t.entry)}" required></label><label class="f">Exit price (blank if open)<input name="exit" inputmode="decimal" value="${v(t.exit)}"></label><label class="f">Stop-loss<input name="sl" inputmode="decimal" value="${v(t.sl)}"></label><label class="f">Take-profit<input name="tp" inputmode="decimal" value="${v(t.tp)}"></label>
    <label class="f" style="grid-column:1/-1">Profit / loss in account currency (optional)<input name="pnl" inputmode="decimal" value="${v(t.pnl)}"></label><label class="f" style="grid-column:1/-1">Notes, setup, emotions<textarea name="notes">${esc(t.notes || "")}</textarea></label><p class="dn sm" id="jerr" style="grid-column:1/-1"></p><button class="btn pri" type="submit" style="grid-column:1/-1">${t.id ? "Save changes" : "Add trade"}</button></form>`);
  $("#jf").addEventListener("submit", e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)), n = { id: t.id || Date.now(), ts: Date.parse(f.ts) || Date.now(), ins: String(f.ins).trim().toUpperCase(), dir: f.dir, entry: nv(f.entry), exit: nv(f.exit), sl: nv(f.sl), tp: nv(f.tp), lots: nv(f.lots), pnl: nv(f.pnl), notes: f.notes.trim() };
    if (!n.ins || !Number.isFinite(n.entry)) return $("#jerr").textContent = "Enter the instrument and the entry price."; if (Number.isFinite(n.sl) && (n.dir === "Long" ? n.sl >= n.entry : n.sl <= n.entry)) return $("#jerr").textContent = "For a " + n.dir.toLowerCase() + " the stop-loss must be " + (n.dir === "Long" ? "below" : "above") + " the entry.";
    const i = ST.journal.findIndex(x => x.id === n.id); if (i >= 0) ST.journal[i] = n; else ST.journal.push(n); commit("journal"); ACT.close(); toast("Trade saved"); VIEWS.journal.mount(); }); };
ACT.jadd = () => jform(); ACT.jedit = a => jform(ST.journal.find(t => String(t.id) === a.dataset.id));
ACT.jdel = a => { if (!confirm("Delete this trade?")) return; ST.journal = ST.journal.filter(t => String(t.id) !== a.dataset.id); commit("journal"); VIEWS.journal.mount(); };
ACT.jcsv = () => ST.journal.length ? csv("trading-journal.csv", [["Date", "Instrument", "Direction", "Entry", "Exit", "Stop", "Target", "Lots", "P/L", "R", "Result", "Notes"], ...ST.journal.map(t => [new Date(t.ts).toISOString(), t.ins, t.dir, t.entry, t.exit, t.sl, t.tp, t.lots, t.pnl, rOf(t) == null ? "" : rOf(t).toFixed(3), outcomeOf(t), t.notes])]) : toast("Nothing to export yet");

/* ---------- SAVED RESOURCES ---------- */
VIEWS.saved = { nav: "Saved Resources", icon: "saved", title: "Saved Resources", active: () => (location.hash || "").includes("saved"),
  render() { const n = ST.saved.filter(x => x.type === "news"), l = ST.saved.filter(x => LESSONS.some(y => y.id === x.id) || x.type === "lesson");
    return `<h1>Saved Resources</h1><p class="lead">Articles and lessons you bookmarked. Saved ${ST.verified && SYNC.saved ? "to your account" : "on this device only"}.</p>${ST.saved.length ? `${l.length ? `<h3 style="margin:10px 0">Lessons</h3><div class="g g2">${l.map(x => { const ls = LESSONS.find(y => y.id === x.id); return ls ? `<div class="art"><div class="m"><span class="tag">${ls.cat}</span></div><h4>${ls.t}</h4><div class="row" style="justify-content:space-between"><button class="btn sm pri" data-act="lesson" data-id="${ls.id}">Read lesson</button>${bkBtn(ls.id, true)}</div></div>` : ""; }).join("")}</div>` : ""}
    ${n.length ? `<h3 style="margin:22px 0 10px">Articles</h3><div class="g g2">${n.map(a => artCard(a)).join("")}</div>` : ""}` : empty("Nothing saved yet", "Use the bookmark icon on any article or lesson and it will appear here.", '<a class="btn sm" href="#/news">Browse news</a> <a class="btn sm" href="#/education">Browse lessons</a>')}`; } };
const oldBk = ACT.bk; ACT.bk = (a, e) => { const id = a.dataset.id, ls = LESSONS.find(x => x.id === id); if (ls) { toggleSave({ id, type: "lesson", title: ls.t }); a.classList.toggle("on", isSaved(id)); if (location.hash.includes("saved")) route(); } else oldBk(a, e); };

/* ---------- NOTIFICATIONS ---------- */
const TOPICS = [["news", "Market news"], ["forex", "Forex updates"], ["crypto", "Cryptocurrency updates"], ["cal", "Economic calendar reminders (needs backend scheduling)"], ["edu", "Trading education"], ["prop", "Prop firm information"]];
VIEWS.notifications = { nav: "Notifications", icon: "bell", title: "Notifications",
  render() { const s = ST.prefs.sub || { state: "none" }, tp = ST.prefs.topics || {}, st = subState(); const msg = { none: "You are not subscribed to marketing emails. Creating an account does not subscribe you.", pending: "Your request was submitted" + (s.at ? " on " + when(new Date(s.at)) : "") + ". You are not subscribed until you confirm using the link in the confirmation email.", subscribed: "The server reports your subscription as confirmed.", unsub: "You unsubscribed" + (s.at ? " on " + when(new Date(s.at)) : "") + ". No marketing emails will be sent." }[s.state];
    return `<h1>Notifications</h1><p class="lead">Marketing emails are separate from essential account messages, and they are off until you opt in.</p>
    <div class="note ${s.state === "subscribed" ? "good" : s.state === "pending" ? "warn" : ""}" style="margin-bottom:14px"><b>${st[0]}</b><br>${msg}</div>
    <div class="g g2"><div class="panel"><h3>Email subscription</h3><div id="nform">${TOPICS.map(([k, l]) => `<label class="li" style="cursor:pointer"><span>${l}</span><span class="sw"><input type="checkbox" data-topic="${k}" ${tp[k] ? "checked" : ""}><i></i></span></label>`).join("")}
      <label class="li" style="justify-content:flex-start;cursor:pointer;border-bottom:0"><input type="checkbox" id="optin"><span class="sm">I want to receive XSupport marketing emails at <b>${esc(ST.user?.email || "my account email")}</b>. I can unsubscribe at any time.</span></label>
      <p class="dn sm" id="nerr" role="alert"></p><div class="row"><button class="btn pri" data-act="nsub">Subscribe / update</button></div>
      <p class="mut sm" style="margin-top:12px">Confirmation depends on your backend: the request below is sent to <code>/api/subscribe</code>, and a confirmation email must be sent by your server.</p></div></div>
    <div class="panel"><h3>Essential account notifications</h3><p class="mut" style="line-height:1.65;font-size:15px">Security alerts, password changes, email verification and service notices are not marketing. They are sent regardless of newsletter choices. These notices need your backend to send them; none are being sent from this page.</p></div></div>
    <h3 style="margin:24px 0 8px">Notification history</h3><div class="panel">${ST.notifs.length ? ST.notifs.map(n => `<div class="li"><span class="sm">${esc(n.m)}</span><span class="mut sm">${when(new Date(n.t))}</span></div>`).join("") : `<p class="mut sm">No notifications yet. This list shows actions taken in this dashboard. Server-sent account notices will appear here once a notifications endpoint exists.</p>`}</div>`; } };
ACT.nsub = async a => { const topics = {}; $$("[data-topic]").forEach(c => topics[c.dataset.topic] = c.checked); ST.prefs.topics = topics; commit("prefs"); const err = $("#nerr");
  if (!$("#optin").checked) return err.textContent = "Tick the box to confirm you want marketing emails."; if (!Object.values(topics).some(Boolean)) return err.textContent = "Choose at least one topic."; if (!ST.user?.email) return err.textContent = "No email address on this session."; err.textContent = ""; a.disabled = true;
  const r = await api("/api/subscribe", { method: "POST", body: { email: ST.user.email, topics: Object.keys(topics).filter(k => topics[k]), consent: true, source: "dashboard" } }); a.disabled = false;
  if (!r.ok) return err.textContent = r.data?.error || r.data?.message || (r.status === 0 ? "Could not reach the server. Nothing was saved." : r.status === 404 ? "The subscription endpoint was not found on your backend. Nothing was submitted." : "Request failed (" + r.status + ").");
  const confirmed = r.data?.confirmed === true || r.data?.status === "confirmed"; ST.prefs.sub = { state: confirmed ? "subscribed" : "pending", at: Date.now() }; commit("prefs"); note(confirmed ? "Newsletter subscription confirmed by server" : "Newsletter request submitted. Awaiting email confirmation"); toast(confirmed ? "Subscribed" : "Request submitted. Check your inbox to confirm."); route(); };
ACT.nunsub = async a => { if (!ST.user?.email) return; a.disabled = true; const r = await api("/api/unsub", { method: "POST", body: { email: ST.user.email } }); a.disabled = false;
  if (!r.ok) return $("#nerr").textContent = r.data?.error || r.data?.message || (r.status === 0 ? "Could not reach the server." : "Unsubscribe request failed (" + r.status + ").");
  ST.prefs.sub = { state: "unsub", at: Date.now() }; commit("prefs"); note("Unsubscribed from marketing emails"); toast("Unsubscribed"); route(); };

/* ---------- ACCOUNT ---------- */
VIEWS.account = { nav: "Account Settings", icon: "user", title: "Account Settings",
  render() { const u = ST.user || {}, name = u.name || u.fullName || "Not provided", ver = u.emailVerified ?? u.email_verified ?? u.verified, cr = u.createdAt || u.created_at || u.created;
    const row = (l, v) => `<div class="li"><span class="mut">${l}</span><span style="text-align:right;word-break:break-word">${v}</span></div>`;
    return `<h1>Account Settings</h1><p class="lead">Your profile, security and data. Passwords and tokens are never displayed here.</p>
    <div class="g g2"><div class="panel"><h3>Profile</h3>${row("Full name", esc(name))}${row("Email", esc(u.email || "Not provided"))}${row("Email verification", ver === true || ver === 1 ? '<span class="tag ok">Verified</span>' : ver === false || ver === 0 ? '<span class="tag md">Not verified</span>' : '<span class="tag">Unknown: not provided by the server</span>')}${row("Account created", cr ? esc(fmt(new Date(cr), { day: "numeric", month: "long", year: "numeric" })) : "Not provided by the server")}${row("Session", ST.verified ? '<span class="tag ok">Verified by server</span>' : '<span class="tag md">Unverified (preview)</span>')}</div>
    <div class="panel"><h3>Account security</h3><p class="mut" style="line-height:1.7">Your account uses the existing XSupport sign-in service. Password changes and email verification are not available in this version. Never share your password.</p></div></div>
    <div class="panel" style="margin-top:14px"><h3>Where your data is stored</h3>${["prefs:Notification preferences", "saved:Saved resources", "journal:Trading journal", "progress:Learning progress", "firms:Prop firm comparison"].map(x => { const [k, l] = x.split(":"); return row(l, SYNC[k] ? '<span class="tag ok">Synced to your account</span>' : '<span class="tag">This device only</span>'); }).join("")}<p class="mut sm" style="margin-top:12px;line-height:1.6">Device-only data stays in this browser and is lost if you clear site data. Your existing Worker does not provide cloud synchronization. Use the export button to keep a backup.</p><p style="margin-top:12px"><button class="btn sm" data-act="export">Download my data (JSON)</button></p></div>
    <div class="row" style="margin-top:18px"><button class="btn" data-act="signout">Sign out</button></div>`; },
};

ACT.export = () => { const d = {}; ["prefs", "saved", "journal", "progress", "firms"].forEach(k => d[k] = ST[k]); const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(d, null, 2)], { type: "application/json" })); a.download = "xsupport-my-data.json"; a.click(); };

/* ---------- SEARCH (lessons, glossary, saved, cached news) ---------- */
VIEWS.search = { title: "Search",
  render() { const q = (new URLSearchParams(location.hash.split("?")[1] || "").get("q") || "").trim().toLowerCase(); if (!q) return `<h1>Search</h1>${empty("Type in the search box", "Search lessons, glossary terms, saved items and loaded news.")}`;
    const has = s => String(s).toLowerCase().includes(q), L = LESSONS.filter(l => has(l.t + " " + l.cat + " " + l.b.join(" "))), G = GLOSS.filter(g => has(g[0] + " " + g[1])), S = ST.saved.filter(s => has(s.title || "")), N = (NEWS.items || []).filter(a => has(a.title + " " + a.sum)).slice(0, 8);
    return `<h1>Search results</h1><p class="lead">For “${esc(q)}”</p>${!(L.length + G.length + S.length + N.length) ? empty("No results", "Try different words.") : ""}
    ${L.length ? `<h3 style="margin:14px 0 8px">Lessons</h3><div class="g g2">${L.map(l => `<div class="art"><div class="m"><span class="tag">${l.cat}</span></div><h4>${l.t}</h4><button class="btn sm pri" data-act="lesson" data-id="${l.id}">Read lesson</button></div>`).join("")}</div>` : ""}
    ${G.length ? `<h3 style="margin:18px 0 8px">Prop firm glossary</h3><div class="panel" style="padding:6px 18px">${G.map(g => `<details open><summary>${g[0]}</summary><p>${g[1]}</p></details>`).join("")}</div>` : ""}
    ${S.length ? `<h3 style="margin:18px 0 8px">Saved</h3><div class="g g2">${S.map(s => s.type === "news" ? artCard(s) : `<div class="art"><h4>${esc(s.title)}</h4></div>`).join("")}</div>` : ""}
    ${N.length ? `<h3 style="margin:18px 0 8px">News</h3><div class="g g2">${N.map(artCard).join("")}</div>` : ""}`; } };
let sq; $("#q").addEventListener("input", e => { clearTimeout(sq); sq = setTimeout(() => { const v = e.target.value.trim(); if (v) location.hash = "#/search?q=" + encodeURIComponent(v); }, 350); });

/* ---------- GO ---------- */
boot();

</script>
</body>
</html>
